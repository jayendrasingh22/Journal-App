# Keep secrets outside source control.
app.security.jwt-secret=${JWT_SECRET:}

# Placeholder values allow local startup; set real credentials to enable Google sign-in.
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:configure-google-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:configure-google-client-secret}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

springdoc.swagger-ui.path=/swagger-ui.html
